            { id: 25, start: "21:30", end: "21:30", dept: "VEM", activity: "VEM-VCC③ VEM-CCC③ VEM-ACP② ボランティアチェックアウト", activityEn: "VEM-VCC③VEM-CCC③VEM-ACP② Check out", note: "-" },

            { id: 27, start: "21:30", end: "22:00", dept: "VEM", activity: "施錠", activityEn: "Key Rock", note: "-" },
            { id: 28, start: "21:30", end: "21:30", dept: "VEM", activity: "エアコンスイッチオフ", activityEn: "Air Condition off", note: "-" },
            { id: 29, start: "22:00", end: "22:00", dept: "VEM", activity: "VGM・DVGM・VEM・FAM チェックアウト", activityEn: "VGM・DVGM・VEM・FAM Check OUT", note: "-" }
        ];

        const schedule927 = JSON.parse(JSON.stringify(schedule926));
        const schedule928 = JSON.parse(JSON.stringify(schedule926));

        const scheduleData = {
            "2026-09-24": standardSchedule,
            "2026-09-25": standardSchedule,
            "2026-09-26": schedule926,
            "2026-09-27": schedule927,
            "2026-09-28": schedule928
        };

        const dates = [
            { date: "2026-09-24", label: "9月24日 (木)" },
            { date: "2026-09-25", label: "9月25日 (金)" },
            { date: "2026-09-26", label: "9月26日 (土)" },
            { date: "2026-09-27", label: "9月27日 (日)" },
            { date: "2026-09-28", label: "9月28日 (月)" },
        ];

        let currentIndex = 0;
        let currentDeptFilter = 'ALL';
        let userEdits = JSON.parse(localStorage.getItem('hsc_schedule_edits_v7') || '{}');
        let userChecks = JSON.parse(localStorage.getItem('hsc_schedule_checks_v7') || '{}');
        let alertedTasks = new Set();

        function init() {
            renderTable();
            updateDateLabel();
            setInterval(updateClockAndAlerts, 1000);
        }

        function changeDay(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = dates.length - 1;
            if (currentIndex >= dates.length) currentIndex = 0;
            renderTable();
            updateDateLabel();
        }

        function updateDateLabel() {
            document.getElementById('current-date-label').textContent = dates[currentIndex].label;
        }

        function filterDept(dept) {
            currentDeptFilter = dept;
            document.querySelectorAll('.dept-btn').forEach(btn => {
                if(btn.textContent.includes(dept) || (dept === 'ALL' && btn.textContent === 'すべて')) {
                    btn.className = "dept-btn px-3 py-1 rounded-full text-xs font-semibold bg-indigo-600 text-white transition";
                } else {
                    btn.className = "dept-btn px-3 py-1 rounded-full text-xs font-semibold bg-slate-200 text-slate-700 hover:bg-slate-300 transition";
                }
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('schedule-tbody');
            tbody.innerHTML = '';
            
            const targetDate = dates[currentIndex].date;
            const dayItems = scheduleData[targetDate] || [];
            
            const filtered = dayItems.filter(item => {
                return currentDeptFilter === 'ALL' || item.dept.includes(currentDeptFilter);
            });

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-slate-400">データがありません</td></tr>`;
                return;
            }

            let completedCount = 0;
            const totalCount = filtered.length;

            filtered.forEach(item => {
                const editKey = `${targetDate}_${item.id}`;
                const startTime = userEdits[editKey]?.start || item.start;
                const endTime = userEdits[editKey]?.end || item.end;
                const isChecked = userChecks[editKey] || false;
                if(isChecked) completedCount++;

                const tr = document.createElement('tr');
                tr.id = `row-${targetDate}-${item.id}`;
                tr.className = `hover:bg-slate-50 transition border-b border-slate-100 ${isChecked ? 'opacity-50 bg-slate-50 line-through' : ''}`;
                
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${targetDate}', ${item.id}, this.checked)" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer">
                    </td>
                    <td class="py-3 px-4 font-mono font-medium text-indigo-600">
                        <input type="text" value="${startTime}" class="bg-transparent border border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-white rounded px-1.5 py-0.5 w-20 text-sm outline-none transition" onchange="updateTime('${targetDate}', ${item.id}, 'start', this.value)">
                    </td>
                    <td class="py-3 px-4 font-mono text-slate-600">
                        <input type="text" value="${endTime}" class="bg-transparent border border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-white rounded px-1.5 py-0.5 w-20 text-sm outline-none transition" onchange="updateTime('${targetDate}', ${item.id}, 'end', this.value)">
                    </td>
                    <td class="py-3 px-4">
                        <span class="inline-block px-2 py-0.5 text-xs font-bold rounded bg-slate-100 text-slate-700 border border-slate-200">${item.dept}</span>
                    </td>
                    <td class="py-3 px-4">
                        <div class="font-medium text-slate-800">${item.activity}</div>
                        <div class="text-xs text-slate-400">${item.activityEn}</div>
                    </td>
                    <td class="py-3 px-4 text-xs text-slate-500">${item.note}</td>
                `;
                tbody.appendChild(tr);
            });

            // 進捗バー更新
            const percent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
            document.getElementById('progress-text').textContent = `進捗: ${completedCount} / ${totalCount} (${percent}%)`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function updateTime(date, id, field, value) {
            const editKey = `${date}_${id}`;
            if (!userEdits[editKey]) userEdits[editKey] = {};
            userEdits[editKey][field] = value;
            localStorage.setItem('hsc_schedule_edits_v7', JSON.stringify(userEdits));
        }

        function toggleCheck(date, id, checked) {
            const editKey = `${date}_${id}`;
            userChecks[editKey] = checked;
            localStorage.setItem('hsc_schedule_checks_v7', JSON.stringify(userChecks));
            renderTable();
        }

        function updateClockAndAlerts() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;

            // 5分前チェック (現在表示中の日付が今日またはデモ用の場合)
            const targetDateObj = new Date(dates[currentIndex].date);
            const todayStr = now.toISOString().split('T')[0];
            
            // デモおよび実運用用に、時刻が一致するものをチェック
            const currentHM = `${hours}:${minutes}`;
            const dayItems = scheduleData[dates[currentIndex].date] || [];

            dayItems.forEach(item => {
                const editKey = `${dates[currentIndex].date}_${item.id}`;
                const startTime = userEdits[editKey]?.start || item.start; // 例: "08:00"
                
                // 5分前の時刻計算
                if (startTime && startTime.length >= 5) {
                    const [sh, sm] = startTime.split(':').map(Number);
                    if (!isNaN(sh) && !isNaN(sm)) {
                        let totalMin = sh * 60 + sm - 5;
                        let alertH = Math.floor(totalMin / 60);
                        let alertM = totalMin % 60;
                        let alertHM = `${String(alertH).padStart(2, '0')}:${String(alertM).padStart(2, '0')}`;

                        if (currentHM === alertHM && !alertedTasks.has(editKey)) {
                            alertedTasks.add(editKey);
                            triggerAlert(item.activity, startTime);
                        }
                    }
                }
            });
        }

        function triggerAlert(activityName, startTime) {
            playBeep();
            if (Notification.permission === "granted") {
                new Notification("まもなく開始のタスク (5分前)", {
                    body: `[${startTime}] ${activityName}`,
                    icon: "https://cdn-icons-png.flaticon.com/512/3239/3239952.png"
                });
            }
            const banner = document.getElementById('active-alert-banner');
            banner.innerHTML = `<span class="text-amber-300 font-bold animate-pulse">🔔 5分前アラート: [${startTime}] ${activityName} がまもなく始まります！</span>`;
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } catch(e) {}
        }

        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("お使いのブラウザは通知に対応していません。");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("通知が有効化されました。各項目の5分前にデスクトップ通知が届きます。");
                    document.getElementById('notif-btn').textContent = "🔔 通知有効";
                    document.getElementById('notif-btn').className = "bg-emerald-600 text-white px-3 py-1.5 rounded text-sm font-medium shadow transition";
                } else {
                    alert("通知が拒否されました。ブラウザの設定をご確認ください。");
                }
            });
        }

        function scrollToCurrentTime() {
            const container = document.getElementById('table-container');
            container.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function exportData() {
            const dataObj = { edits: userEdits, checks: userChecks };
            const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hsc_schedule_backup_${dates[currentIndex].date}.json`;
            a.click();
        }

        function resetData() {
            if(confirm('変更した時間やチェック状態をすべて初期化しますか？')) {
                localStorage.removeItem('hsc_schedule_edits_v7');
                localStorage.removeItem('hsc_schedule_checks_v7');
                userEdits = {};
                userChecks = {};
                renderTable();
            }
        }

        window.onload = init;
    </script>
</body>
</html>

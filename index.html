                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                <span class="px-2 py-0.5 text-[11px] font-bold rounded border ${typeColor} shrink-0">🚌 ${bus.type} (${bus.target})</span>
                                <span class="font-mono text-[11px] text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded font-semibold">${countryName || bus.code}</span>
                                <div class="font-mono text-xs sm:text-sm font-semibold text-indigo-600 flex items-center gap-1">
                                    <input type="text" value="${startTime}" class="bg-white border border-slate-200 rounded px-1.5 py-0.5 w-16 text-xs text-center outline-none focus:border-indigo-500" onchange="updateEdit('${editKey}', 'start', this.value)">
                                    <span class="text-slate-400">着 〜</span>
                                    <input type="text" value="${endTime}" class="bg-white border border-slate-200 rounded px-1.5 py-0.5 w-16 text-xs text-center outline-none focus:border-indigo-500" onchange="updateEdit('${editKey}', 'end', this.value)">
                                    <span class="text-slate-400">発</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            updateProgress(completedCount, totalCount);
        }

        function renderTrainingSchedule() {
            const container = document.getElementById('schedule-list-container');
            container.innerHTML = '';
            
            const targetDate = dates[currentIndex].date;
            const items = trainingData[targetDate] || [];

            if(items.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 text-center text-slate-400 rounded-xl shadow-sm">この日の練習スケジュールはありません</div>`;
                updateProgress(0, 0);
                return;
            }

            let completedCount = 0;
            const totalCount = items.length;

            items.forEach((tr, index) => {
                const editKey = `${targetDate}_training_${index}`;
                const isChecked = userChecks[editKey] || false;
                if(isChecked) completedCount++;

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border bg-white border-slate-200 transition flex flex-col gap-2 ${isChecked ? 'opacity-50 bg-slate-50' : ''}`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2 flex-wrap">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${editKey}', this.checked)" class="w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer shrink-0">
                            <span class="px-2 py-0.5 text-xs font-bold rounded bg-cyan-100 text-cyan-800 border border-cyan-300">🏊‍♀️ ${tr.session}</span>
                        </div>
                        <div class="font-mono text-xs font-bold text-slate-600 bg-slate-100 px-2 py-1 rounded">
                            入場: ${tr.enter} | 開始: ${tr.start} 〜 終了: ${tr.end} | 退場: ${tr.exit}
                        </div>
                    </div>
                    <div class="text-sm font-semibold text-slate-800 pl-7">
                        対象: ${tr.nocs}
                    </div>
                    <div class="text-xs text-indigo-600 font-medium pl-7 bg-indigo-50/50 p-1.5 rounded">
                        🎵 ${tr.music}
                    </div>
                `;
                container.appendChild(card);
            });

            updateProgress(completedCount, totalCount);
        }

        function updateProgress(completedCount, totalCount) {
            const percent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
            document.getElementById('progress-text').textContent = `進捗: ${completedCount}/${totalCount} (${percent}%)`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function updateEdit(editKey, field, value) {
            if (!userEdits[editKey]) userEdits[editKey] = {};
            userEdits[editKey][field] = value;
            localStorage.setItem('hsc_edits_v15', JSON.stringify(userEdits));
        }

        function toggleCheck(editKey, checked) {
            userChecks[editKey] = checked;
            localStorage.setItem('hsc_checks_v15', JSON.stringify(userChecks));
            renderView();
        }

        function updateClockAndAlerts() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;

            if (seconds === '00' && currentTab === 'run') {
                renderView();
            }
        }

        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("お使いのブラウザは通知に対応していません。");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("通知が有効化されました。");
                    document.getElementById('notif-btn').textContent = "🔔有効";
                }
            });
        }

        function scrollToCurrentTime() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function exportData() {
            const dataObj = { edits: userEdits, checks: userChecks };
            const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hsc_operation_backup_${dates[currentIndex].date}.json`;
            a.click();
        }

        function resetData() {
            if(confirm('変更した内容やチェック状態をすべて初期化しますか？')) {
                localStorage.removeItem('hsc_edits_v15');
                localStorage.removeItem('hsc_checks_v15');
                userEdits = {};
                userChecks = {};
                renderView();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
